<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
<style>
:root {
  --ink: #333333;
  --muted: #666666;
  --faint: #767676;
  --line: #E8E8E8;
  --line-strong: #D6D6D6;
  --bg: #FFFFFF;
  --soft: #FAFAFA;
  --accent: #DC3522;
  --accent-ink: #B32A1A;
  --accent-bg: #FCEFED;
  --radius: 6px;
  --sans: 'Roboto', system-ui, sans-serif;
  --mono: 'Roboto Mono', ui-monospace, monospace;
  --chip-h: 36px;
}
@media (pointer: coarse) { :root { --chip-h: 44px; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 300 16px/1.5 var(--sans); }
h1, h2 { font-weight: 300; margin: 0; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, kbd { font-family: var(--mono); }
kbd { font-size: 12px; background: var(--soft); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }
svg.i { width: 18px; height: 18px; flex: none; }

.btn { height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--soft); color: var(--ink); font: inherit; font-weight: 400; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn:hover { border-color: #bbb; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { height: 36px; padding: 0 12px; font-size: 14px; }
input[type=text], input[type=email], input[type=tel], input[type=url], input[type=password], input[type=number], textarea, select {
  font: inherit; font-size: 14px; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--soft); padding: 8px 10px; color: var(--ink); width: 100%; min-width: 0; }
input[type=text], input[type=email], input[type=tel], input[type=url], input[type=password], input[type=number], select { height: 40px; }
input[type=number] { font-family: var(--mono); }
textarea { resize: vertical; min-height: 88px; line-height: 1.45; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; height: 28px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100vh; }

.stage { position: relative; background: var(--soft); border-right: 1px solid var(--line); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px; padding: 28px; min-width: 0; min-height: 0; overflow: hidden; }
.qrbox { width: min(100%, 62vh, 520px); aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  background-color: #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 28px rgba(0,0,0,.07);
  background-image: linear-gradient(45deg, #f1f1f1 25%, transparent 25%), linear-gradient(-45deg, #f1f1f1 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #f1f1f1 75%), linear-gradient(-45deg, transparent 75%, #f1f1f1 75%);
  background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
.qrbox svg { display: block; }
.qrbox.err { background: #fff; color: var(--accent-ink); font-size: 14px; padding: 24px; text-align: center; }
.info { font: 13px var(--mono); color: var(--faint); text-align: center; }
.warn { font-size: 13px; color: var(--accent-ink); background: var(--accent-bg); border: 1px solid #f1c4be; border-radius: var(--radius); padding: 6px 10px; max-width: 520px; text-align: center; }
.stage .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

.panel { overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 20px; }
.label { font-size: 13px; font-weight: 400; color: var(--faint); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: var(--chip-h); padding: 0 11px; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--bg); color: var(--ink); font: 400 14px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: #bbb; }
.chip[aria-pressed=true] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-ink); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--faint); font-weight: 400; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; min-height: 28px; }
.fields { display: flex; flex-direction: column; gap: 8px; }
.count { font: 12px var(--mono); color: var(--faint); }

.presets { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.preset { aspect-ratio: 1; border: 1px solid var(--line-strong); border-radius: var(--radius); background: #fff; cursor: pointer; padding: 5px; }
.preset:hover { border-color: #bbb; }
.preset[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.preset svg, .preset canvas { width: 100%; height: 100%; display: block; }
.styles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

.color { display: flex; align-items: center; gap: 6px; height: 40px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--soft); padding: 0 6px; }
.color input[type=color] { width: 28px; height: 28px; border: 0; padding: 0; background: none; cursor: pointer; flex: none; }
.color input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.color input[type=color]::-webkit-color-swatch { border: 1px solid rgba(0,0,0,.15); border-radius: 4px; }
.color input[type=text] { border: 0; background: none; height: 36px; padding: 0 2px; font: 13px var(--mono); }
.color.off { opacity: .45; }
.range { display: grid; grid-template-columns: 1fr 44px; gap: 8px; align-items: center; }
.range output { font: 13px var(--mono); text-align: right; color: var(--muted); }

.logo { display: flex; gap: 10px; align-items: center; }
.logo .thumb { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff center/contain no-repeat; flex: none; }
.logo .meta { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
.icon-btn { width: 44px; height: 44px; flex: none; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--bg); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover { border-color: #bbb; }
details > summary { cursor: pointer; font-size: 13px; color: var(--faint); font-weight: 400; list-style: none; display: flex; align-items: center; gap: 6px; min-height: 28px; }
details > summary::before { content: ''; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; margin: 0 4px 0 2px; }
details[open] > summary::before { transform: rotate(45deg); }
details > summary::-webkit-details-marker { display: none; }
details .body { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.keys { font-size: 12px; color: var(--faint); line-height: 1.9; }

.drop { position: fixed; inset: 0; z-index: 10; pointer-events: none; background: rgba(252, 239, 237, .92);
  border: 2px dashed var(--accent); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
  color: var(--accent-ink); font-size: 22px; }
.drop svg { width: 48px; height: 48px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff;
  padding: 10px 16px; border-radius: var(--radius); font-size: 14px; font-weight: 400; z-index: 11; box-shadow: 0 4px 16px rgba(0,0,0,.15); }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .stage { border-right: 0; border-bottom: 1px solid var(--line); padding: 20px 16px; }
  .qrbox { width: min(100%, 360px); }
  .panel { overflow: visible; padding: 16px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/></symbol>
  </defs>
</svg>

<div class="app">
  <main class="stage">
    <div class="qrbox" id="qr" aria-label="QR code preview" role="img"></div>
    <div class="info" id="info"></div>
    <div class="warn" id="warn" hidden></div>
    <div class="actions">
      <button class="btn primary" id="dlPng"><svg class="i"><use href="#i-down"/></svg>PNG</button>
      <button class="btn" id="dlSvg"><svg class="i"><use href="#i-down"/></svg>SVG</button>
      <button class="btn" id="copy" title="Copy as PNG image"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
    </div>
    <div class="keys"><kbd>Ctrl</kbd>+<kbd>S</kbd> PNG · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> SVG · drop or paste an image to add a logo</div>
  </main>

  <aside class="panel">
    <section class="sec">
      <div class="label">Content</div>
      <div class="chips" id="kinds"></div>
      <div class="fields" id="fields"></div>
    </section>

    <section class="sec">
      <div class="label">Style</div>
      <div class="presets" id="presets"></div>
      <div class="styles">
        <label class="field">Dots<select id="dotType"></select></label>
        <label class="field">Corners<select id="cornerSq"></select></label>
        <label class="field">Corner dots<select id="cornerDot"></select></label>
      </div>
    </section>

    <section class="sec">
      <div class="label">Colours</div>
      <div class="two">
        <label class="field">Foreground<span class="color"><input type="color" id="fg"><input type="text" id="fgHex" spellcheck="false" aria-label="Foreground hex"></span></label>
        <label class="field" id="fg2Wrap">Gradient end<span class="color"><input type="color" id="fg2"><input type="text" id="fg2Hex" spellcheck="false" aria-label="Gradient end hex"></span></label>
      </div>
      <div class="two">
        <label class="field">Gradient<select id="grad"><option value="">None</option><option value="linear">Linear</option><option value="radial">Radial</option></select></label>
        <label class="field" id="rotWrap">Angle<select id="rot"><option value="0">→ 0°</option><option value="45">↘ 45°</option><option value="90">↓ 90°</option><option value="135">↙ 135°</option></select></label>
      </div>
      <div class="two">
        <label class="field">Corner colour<span class="color" id="ccBox"><input type="color" id="cc"><input type="text" id="ccHex" spellcheck="false" aria-label="Corner colour hex"></span></label>
        <label class="field">Background<span class="color" id="bgBox"><input type="color" id="bg"><input type="text" id="bgHex" spellcheck="false" aria-label="Background hex"></span></label>
      </div>
      <div class="two">
        <label class="check"><input type="checkbox" id="ccSame">Corners match</label>
        <label class="check"><input type="checkbox" id="transparent">Transparent</label>
      </div>
      <button class="btn sm" id="swap" style="align-self:flex-start"><svg class="i"><use href="#i-swap"/></svg>Swap foreground &amp; background</button>
    </section>

    <section class="sec">
      <div class="label">Logo</div>
      <div class="logo">
        <div class="thumb" id="logoThumb"></div>
        <div class="meta" id="logoMeta">Drop, paste or choose an image to place in the centre.</div>
        <button class="btn sm" id="logoPick">Choose</button>
        <button class="icon-btn" id="logoClear" title="Remove logo" aria-label="Remove logo" hidden><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div id="logoOpts" class="fields" hidden>
        <label class="field">Size<span class="range"><input type="range" id="logoSize" min="0.15" max="0.5" step="0.01"><output id="logoSizeV"></output></span></label>
        <label class="field">Padding<span class="range"><input type="range" id="logoMargin" min="0" max="20" step="1"><output id="logoMarginV"></output></span></label>
        <label class="check"><input type="checkbox" id="logoHide">Clear the dots behind the logo</label>
      </div>
    </section>

    <section class="sec">
      <details id="adv">
        <summary>Shape, margin &amp; error correction</summary>
        <div class="body">
          <div class="two">
            <label class="field">Shape<select id="shape"><option value="square">Square</option><option value="circle">Circle</option></select></label>
            <label class="field">Error correction<select id="ecl"><option value="L">Low (7%)</option><option value="M">Medium (15%)</option><option value="Q">Quartile (25%)</option><option value="H">High (30%)</option></select></label>
          </div>
          <label class="field">Margin (quiet zone)<span class="range"><input type="range" id="margin" min="0" max="20" step="1"><output id="marginV"></output></span></label>
          <label class="field">Corner rounding of background<span class="range"><input type="range" id="bgRound" min="0" max="0.5" step="0.01"><output id="bgRoundV"></output></span></label>
          <button class="btn sm" id="reset" style="align-self:flex-start">Reset style</button>
        </div>
      </details>
    </section>

    <section class="sec">
      <div class="label">Export</div>
      <div class="two">
        <label class="field">Size (px)<input type="number" id="size" min="64" max="8192" step="1"></label>
        <label class="field">Raster format<select id="fmt"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="webp">WebP</option></select></label>
      </div>
    </section>
  </aside>
</div>

<input type="file" id="logoInput" accept="image/*" hidden>
<div class="drop" id="drop" hidden><svg><use href="#i-image"/></svg>Drop image to use as logo</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const KEY = 'qr-code:state';

  const DOTS = [['square', 'Square'], ['rounded', 'Rounded'], ['extra-rounded', 'Extra rounded'], ['dots', 'Dots'], ['classy', 'Classy'], ['classy-rounded', 'Classy rounded']];
  const CORNER_SQ = [['square', 'Square'], ['extra-rounded', 'Rounded'], ['dot', 'Circle'], ['rounded', 'Soft'], ['classy', 'Classy'], ['classy-rounded', 'Classy rounded'], ['dots', 'Dots']];
  const CORNER_DOT = [['square', 'Square'], ['dot', 'Circle'], ['rounded', 'Soft'], ['extra-rounded', 'Rounded'], ['classy', 'Classy'], ['classy-rounded', 'Classy rounded'], ['dots', 'Dots']];

  const STYLE_DEFAULT = { dotType: 'square', cornerSq: 'square', cornerDot: 'square', fg: '#000000', fg2: '#DC3522', grad: '', rot: '45',
    cc: '#000000', ccSame: true, bg: '#FFFFFF', transparent: false, shape: 'square', ecl: 'M', margin: 4, bgRound: 0,
    logoSize: 0.3, logoMargin: 4, logoHide: true };
  const PRESETS = [
    { name: 'Classic', s: {} },
    { name: 'Rounded', s: { dotType: 'rounded', cornerSq: 'extra-rounded', cornerDot: 'dot' } },
    { name: 'Dots', s: { dotType: 'dots', cornerSq: 'dot', cornerDot: 'dot' } },
    { name: 'Classy', s: { dotType: 'classy-rounded', cornerSq: 'extra-rounded', cornerDot: 'square', fg: '#1F2A44', cc: '#DC3522', ccSame: false } },
    { name: 'Red', s: { dotType: 'extra-rounded', cornerSq: 'extra-rounded', cornerDot: 'dot', fg: '#DC3522', cc: '#B32A1A', ccSame: false } },
    { name: 'Gradient', s: { dotType: 'rounded', cornerSq: 'extra-rounded', cornerDot: 'dot', fg: '#3B2B8F', fg2: '#DC3522', grad: 'linear', rot: '45', ccSame: true } },
  ];

  const state = {
    kind: 'text',
    f: { text: 'https://simson.io/tools/', ssid: '', pass: '', sec: 'WPA', hidden: false, email: '', subject: '', body: '', phone: '', sms: '',
      first: '', last: '', org: '', title: '', vphone: '', vemail: '', vurl: '', street: '', city: '', zip: '', country: '', lat: '', lng: '' },
    style: { ...STYLE_DEFAULT },
    logo: null, logoName: '',
    size: 1024, fmt: 'png',
  };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (saved.style) Object.assign(state.style, saved.style);
    if (saved.f) Object.assign(state.f, saved.f);
    for (const k of ['kind', 'logo', 'logoName', 'size', 'fmt']) if (saved[k] != null) state[k] = saved[k];
  } catch {}
  let saveT;
  const save = () => { clearTimeout(saveT); saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch { try { localStorage.setItem(KEY, JSON.stringify({ ...state, logo: null })); } catch {} }
  }, 300); };

  // ---------- content ----------
  const esc = (s) => String(s).replace(/([\\;,:"])/g, '\\$1');
  const vEsc = (s) => String(s).replace(/([\\;,])/g, '\\$1').replace(/\n/g, '\\n');
  const KINDS = {
    text: { label: 'Text / URL', fields: [['text', 'Text or link', 'textarea', 'https://example.com']], data: (f) => f.text },
    wifi: { label: 'Wi-Fi', fields: [['ssid', 'Network name (SSID)', 'text'], ['pass', 'Password', 'password'], ['sec', 'Security', ['WPA', 'WEP', 'nopass']], ['hidden', 'Hidden network', 'check']],
      data: (f) => f.ssid ? `WIFI:T:${f.sec};S:${esc(f.ssid)};${f.sec !== 'nopass' ? 'P:' + esc(f.pass) + ';' : ''}${f.hidden ? 'H:true;' : ''};` : '' },
    email: { label: 'Email', fields: [['email', 'To', 'email', 'name@example.com'], ['subject', 'Subject', 'text'], ['body', 'Message', 'textarea']],
      data: (f) => { if (!f.email) return ''; const q = []; if (f.subject) q.push('subject=' + encodeURIComponent(f.subject)); if (f.body) q.push('body=' + encodeURIComponent(f.body)); return 'mailto:' + f.email.trim() + (q.length ? '?' + q.join('&') : ''); } },
    phone: { label: 'Phone', fields: [['phone', 'Phone number', 'tel', '+49 30 1234567']], data: (f) => f.phone ? 'tel:' + f.phone.replace(/[^\d+]/g, '') : '' },
    sms: { label: 'SMS', fields: [['phone', 'Phone number', 'tel'], ['sms', 'Message', 'textarea']], data: (f) => f.phone ? `SMSTO:${f.phone.replace(/[^\d+]/g, '')}:${f.sms}` : '' },
    vcard: { label: 'Contact', fields: [['first', 'First name', 'text'], ['last', 'Last name', 'text'], ['org', 'Organisation', 'text'], ['title', 'Job title', 'text'], ['vphone', 'Phone', 'tel'], ['vemail', 'Email', 'email'], ['vurl', 'Website', 'url'], ['street', 'Street', 'text'], ['zip', 'Postcode', 'text'], ['city', 'City', 'text'], ['country', 'Country', 'text']],
      data: (f) => {
        if (![f.first, f.last, f.org, f.vphone, f.vemail].some(Boolean)) return '';
        const l = ['BEGIN:VCARD', 'VERSION:3.0', `N:${vEsc(f.last)};${vEsc(f.first)};;;`, `FN:${vEsc([f.first, f.last].filter(Boolean).join(' ') || f.org)}`];
        if (f.org) l.push('ORG:' + vEsc(f.org));
        if (f.title) l.push('TITLE:' + vEsc(f.title));
        if (f.vphone) l.push('TEL;TYPE=CELL:' + f.vphone.trim());
        if (f.vemail) l.push('EMAIL:' + f.vemail.trim());
        if (f.vurl) l.push('URL:' + f.vurl.trim());
        if (f.street || f.city || f.zip || f.country) l.push(`ADR;TYPE=WORK:;;${vEsc(f.street)};${vEsc(f.city)};;${vEsc(f.zip)};${vEsc(f.country)}`);
        l.push('END:VCARD');
        return l.join('\n');
      } },
    geo: { label: 'Location', fields: [['lat', 'Latitude', 'text', '52.5200'], ['lng', 'Longitude', 'text', '13.4050']],
      data: (f) => { const a = parseFloat(String(f.lat).replace(',', '.')), b = parseFloat(String(f.lng).replace(',', '.')); return Number.isFinite(a) && Number.isFinite(b) ? `geo:${a},${b}` : ''; } },
  };

  function renderKinds() {
    const box = $('kinds'); box.innerHTML = '';
    for (const [k, d] of Object.entries(KINDS)) {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = d.label; b.setAttribute('aria-pressed', k === state.kind);
      b.addEventListener('click', () => { state.kind = k; save(); renderKinds(); renderFields(true); update(); });
      box.appendChild(b);
    }
  }

  function renderFields(focus) {
    const box = $('fields'); box.innerHTML = '';
    let first = null, row = null;
    const kind = KINDS[state.kind];
    kind.fields.forEach(([key, label, type, ph], i) => {
      let el;
      if (type === 'check') {
        const l = document.createElement('label'); l.className = 'check';
        el = document.createElement('input'); el.type = 'checkbox'; el.checked = !!state.f[key];
        el.addEventListener('change', () => { state.f[key] = el.checked; save(); update(); });
        l.append(el, label); box.appendChild(l); return;
      }
      const l = document.createElement('label'); l.className = 'field'; l.textContent = label;
      if (Array.isArray(type)) {
        el = document.createElement('select');
        for (const o of type) { const op = document.createElement('option'); op.value = o; op.textContent = o === 'nopass' ? 'None' : o; el.appendChild(op); }
      } else if (type === 'textarea') {
        el = document.createElement('textarea'); el.rows = state.kind === 'text' ? 4 : 3;
      } else { el = document.createElement('input'); el.type = type; }
      if (ph) el.placeholder = ph;
      el.value = state.f[key] ?? '';
      el.addEventListener('input', () => { state.f[key] = el.value; save(); update(); });
      l.appendChild(el);
      first ||= el;
      // pair short fields two per row
      const pair = state.kind === 'vcard' && i > 1 || state.kind === 'geo' || (state.kind === 'wifi' && i < 3 && i > 0);
      if (pair) {
        if (!row || row.children.length === 2) { row = document.createElement('div'); row.className = 'two'; box.appendChild(row); }
        row.appendChild(l);
      } else { row = null; box.appendChild(l); }
    });
    if (state.kind === 'text') { const c = document.createElement('div'); c.className = 'count'; c.id = 'count'; box.appendChild(c); }
    if (focus && first) first.focus();
  }

  // ---------- style controls ----------
  const fillSelect = (id, list) => { const s = $(id); for (const [v, t] of list) { const o = document.createElement('option'); o.value = v; o.textContent = t; s.appendChild(o); } };
  fillSelect('dotType', DOTS); fillSelect('cornerSq', CORNER_SQ); fillSelect('cornerDot', CORNER_DOT);

  const normHex = (v) => { v = String(v).trim().replace(/^#?/, '#'); if (/^#[0-9a-f]{3}$/i.test(v)) v = '#' + [...v.slice(1)].map((c) => c + c).join(''); return /^#[0-9a-f]{6}$/i.test(v) ? v.toUpperCase() : null; };
  function bindColor(key) {
    const c = $(key), t = $(key + 'Hex');
    c.addEventListener('input', () => { state.style[key] = c.value.toUpperCase(); t.value = state.style[key]; changed(); });
    t.addEventListener('input', () => { const h = normHex(t.value); if (h) { state.style[key] = h; c.value = h; changed(); } });
    t.addEventListener('blur', () => { t.value = state.style[key]; });
  }
  ['fg', 'fg2', 'cc', 'bg'].forEach(bindColor);
  for (const id of ['dotType', 'cornerSq', 'cornerDot', 'grad', 'rot', 'shape', 'ecl']) $(id).addEventListener('change', () => { state.style[id] = $(id).value; changed(); });
  for (const id of ['ccSame', 'transparent', 'logoHide']) $(id).addEventListener('change', () => { state.style[id] = $(id).checked; changed(); });
  for (const id of ['margin', 'bgRound', 'logoSize', 'logoMargin']) $(id).addEventListener('input', () => { state.style[id] = +$(id).value; changed(); });
  $('swap').addEventListener('click', () => { const s = state.style; [s.fg, s.bg] = [s.bg, s.fg]; if (!s.ccSame) s.cc = s.fg; s.transparent = false; changed(); });
  $('reset').addEventListener('click', () => { state.style = { ...STYLE_DEFAULT }; changed(); });
  $('size').addEventListener('change', () => { state.size = Math.max(64, Math.min(8192, Math.round(+$('size').value) || 1024)); $('size').value = state.size; save(); info(); });
  $('fmt').addEventListener('change', () => { state.fmt = $('fmt').value; save(); $('dlPng').lastChild.textContent = state.fmt.toUpperCase(); });

  function syncControls() {
    const s = state.style;
    for (const id of ['dotType', 'cornerSq', 'cornerDot', 'grad', 'rot', 'shape', 'ecl']) $(id).value = s[id];
    for (const k of ['fg', 'fg2', 'cc', 'bg']) { $(k).value = s[k]; $(k + 'Hex').value = s[k]; }
    for (const id of ['ccSame', 'transparent', 'logoHide']) $(id).checked = s[id];
    for (const id of ['margin', 'bgRound', 'logoSize', 'logoMargin']) $(id).value = s[id];
    $('marginV').textContent = s.margin + '%';
    $('bgRoundV').textContent = Math.round(s.bgRound * 200) + '%';
    $('logoSizeV').textContent = Math.round(s.logoSize * 100) + '%';
    $('logoMarginV').textContent = s.logoMargin + 'px';
    $('fg2Wrap').classList.toggle('off', !s.grad); $('fg2').disabled = $('fg2Hex').disabled = !s.grad;
    $('rotWrap').hidden = s.grad !== 'linear';
    $('ccBox').classList.toggle('off', s.ccSame); $('cc').disabled = $('ccHex').disabled = s.ccSame;
    $('bgBox').classList.toggle('off', s.transparent); $('bg').disabled = $('bgHex').disabled = s.transparent;
    $('size').value = state.size; $('fmt').value = state.fmt; $('dlPng').lastChild.textContent = state.fmt.toUpperCase();
    // logo
    $('logoThumb').style.backgroundImage = state.logo ? `url("${state.logo}")` : '';
    $('logoMeta').textContent = state.logo ? (state.logoName || 'Logo') : 'Drop, paste or choose an image to place in the centre.';
    $('logoClear').hidden = !state.logo; $('logoOpts').hidden = !state.logo;
    // presets
    document.querySelectorAll('.preset').forEach((b, i) => b.setAttribute('aria-pressed', matchesPreset(PRESETS[i])));
  }
  const PRESET_KEYS = ['dotType', 'cornerSq', 'cornerDot', 'fg', 'grad', 'ccSame'];
  const matchesPreset = (p) => { const want = { ...STYLE_DEFAULT, ...p.s }; return PRESET_KEYS.every((k) => state.style[k] === want[k]) && (state.style.ccSame || state.style.cc === want.cc); };

  function changed() { save(); syncControls(); update(); }

  // ---------- QR options ----------
  function gradient(s) {
    if (!s.grad) return undefined;
    return { type: s.grad, rotation: (+s.rot) * Math.PI / 180, colorStops: [{ offset: 0, color: s.fg }, { offset: 1, color: s.fg2 }] };
  }
  function options(size, data, type, st = state.style, logo = state.logo) {
    const s = st;
    const g = gradient(s);
    const cc = s.ccSame ? s.fg : s.cc;
    const cornerGrad = s.ccSame ? g : undefined;
    return {
      type, width: size, height: size, data,
      shape: s.shape,
      margin: Math.round(size * s.margin / 100),
      image: logo || undefined,
      qrOptions: { typeNumber: 0, mode: 'Byte', errorCorrectionLevel: logo && s.ecl !== 'H' && s.ecl !== 'Q' ? 'H' : s.ecl },
      imageOptions: { hideBackgroundDots: s.logoHide, imageSize: s.logoSize, margin: Math.round(s.logoMargin * size / 512), crossOrigin: 'anonymous', saveAsBlob: true },
      dotsOptions: { type: s.dotType, color: s.fg, gradient: g, roundSize: true },
      cornersSquareOptions: { type: s.cornerSq, color: cc, gradient: cornerGrad },
      cornersDotOptions: { type: s.cornerDot, color: cc, gradient: cornerGrad },
      backgroundOptions: { color: s.transparent ? 'rgba(0,0,0,0)' : s.bg, round: s.bgRound },
    };
  }

  const currentData = () => KINDS[state.kind].data(state.f) || '';
  let qr = null;
  function update() {
    const data = currentData();
    const box = $('qr');
    const c = $('count');
    if (c) c.textContent = data ? new TextEncoder().encode(data).length + ' bytes' : '';
    const ok = !!data;
    for (const id of ['dlPng', 'dlSvg', 'copy']) $(id).disabled = !ok;
    if (!ok) { box.className = 'qrbox err'; box.textContent = 'Fill in the fields to create a QR code.'; qr = null; info(); return; }
    try {
      // render at the box's exact pixel size: scaling the SVG afterwards shows hairline seams between modules
      box.className = 'qrbox';
      const px = Math.max(64, Math.floor(box.clientWidth) || 400);
      qr = new QRCodeStyling(options(px, data, 'svg'));
      box.innerHTML = '';
      qr.append(box);
    } catch (e) {
      qr = null; box.className = 'qrbox err';
      const m = String(e?.message || e);
      box.textContent = /overflow/i.test(m) ? 'Too much content for a QR code. Shorten it, lower the error correction or remove the logo.' : 'Couldn\'t create the QR code: ' + m;
      for (const id of ['dlPng', 'dlSvg', 'copy']) $(id).disabled = true;
    }
    info();
  }

  function info() {
    const box = $('info'), warn = $('warn');
    if (!qr) { box.textContent = ''; warn.hidden = true; return; }
    const n = qr._qr?.getModuleCount?.();
    const ver = n ? (n - 17) / 4 : null;
    const ecl = options(1, 'x', 'svg').qrOptions.errorCorrectionLevel;
    box.textContent = (ver ? `Version ${ver} · ${n}×${n} modules · ` : '') + `error correction ${ecl} · export ${state.size}px`;
    // scannability hints
    const s = state.style, w = [];
    const L = (h) => { const v = [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16) / 255).map((c) => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4); return .2126 * v[0] + .7152 * v[1] + .0722 * v[2]; };
    const bgL = s.transparent ? 1 : L(s.bg);
    const fgs = [s.fg, ...(s.grad ? [s.fg2] : []), ...(!s.ccSame ? [s.cc] : [])];
    const worst = Math.min(...fgs.map((f) => (Math.max(L(f), bgL) + .05) / (Math.min(L(f), bgL) + .05)));
    if (fgs.some((f) => L(f) > bgL)) w.push('Light-on-dark codes aren\'t read by every scanner.');
    else if (worst < 3) w.push('Low contrast between foreground and background, the code may not scan.');
    if (s.margin < 2) w.push('A very small margin can make the code hard to scan.');
    if (state.logo && s.logoSize > 0.4) w.push('A large logo covers a lot of the code, test that it still scans.');
    if (s.transparent) w.push('Transparent: make sure it sits on a light background.');
    warn.hidden = !w.length; warn.textContent = w.join(' ');
  }

  // ---------- presets (thumbnails) ----------
  function renderPresets() {
    const box = $('presets');
    PRESETS.forEach((p) => {
      const b = document.createElement('button');
      b.className = 'preset'; b.title = p.name; b.setAttribute('aria-label', p.name + ' style');
      const st = { ...STYLE_DEFAULT, ...p.s, margin: 0 };
      try { new QRCodeStyling(options(80, 'QR', 'svg', st, null)).append(b); const sv = b.querySelector('svg'); if (sv && !sv.getAttribute('viewBox')) sv.setAttribute('viewBox', '0 0 80 80'); } catch {}
      b.addEventListener('click', () => {
        const keep = { shape: state.style.shape, ecl: state.style.ecl, margin: state.style.margin, bg: state.style.bg, transparent: state.style.transparent,
          logoSize: state.style.logoSize, logoMargin: state.style.logoMargin, logoHide: state.style.logoHide, bgRound: state.style.bgRound };
        state.style = { ...STYLE_DEFAULT, ...p.s, ...keep };
        changed();
      });
      box.appendChild(b);
    });
  }

  // ---------- logo ----------
  function setLogo(file) {
    if (!file || !file.type.startsWith('image/')) { toast('That isn\'t an image.'); return; }
    const r = new FileReader();
    r.onload = () => {
      const url = r.result;
      // downscale big images so the state stays small and SVG export stays light
      const img = new Image();
      img.onload = () => {
        let out = url;
        const max = 512;
        if (file.type !== 'image/svg+xml' && (img.width > max || img.height > max)) {
          const k = max / Math.max(img.width, img.height);
          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL('image/png');
        }
        state.logo = out; state.logoName = file.name || 'Pasted image';
        if (state.style.ecl === 'L' || state.style.ecl === 'M') state.style.ecl = 'H';
        changed();
      };
      img.onerror = () => toast('Couldn\'t read that image.');
      img.src = url;
    };
    r.readAsDataURL(file);
  }
  $('logoPick').addEventListener('click', () => $('logoInput').click());
  $('logoInput').addEventListener('change', () => { setLogo($('logoInput').files[0]); $('logoInput').value = ''; });
  $('logoClear').addEventListener('click', () => { state.logo = null; state.logoName = ''; changed(); });

  // ---------- export ----------
  const slug = () => {
    const d = currentData();
    let s = state.kind === 'text' ? (d.match(/^https?:\/\/(?:www\.)?([^/?#]+)/i)?.[1] || d) : state.kind === 'wifi' ? 'wifi-' + state.f.ssid
      : state.kind === 'vcard' ? [state.f.first, state.f.last].join('-') || state.f.org : state.kind;
    s = s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    return 'qr-' + (s || 'code');
  };
  async function blob(ext) {
    const data = currentData();
    const inst = new QRCodeStyling(options(state.size, data, ext === 'svg' ? 'svg' : 'canvas'));
    let b = await inst.getRawData(ext);
    if (ext === 'jpeg' && state.style.transparent) toast('JPEG has no transparency, background is black.');
    return b;
  }
  async function download(ext) {
    if (!qr) return;
    try {
      const b = await blob(ext);
      const url = URL.createObjectURL(b);
      const a = document.createElement('a'); a.href = url; a.download = slug() + '.' + (ext === 'jpeg' ? 'jpg' : ext);
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { toast('Export failed: ' + e.message); }
  }
  async function copy() {
    if (!qr) return;
    try {
      const p = blob('png');
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': p })]);
      toast('Copied PNG to the clipboard');
    } catch { toast('The browser blocked clipboard access. Use Download instead.'); }
  }
  $('dlPng').addEventListener('click', () => download(state.fmt));
  $('dlSvg').addEventListener('click', () => download('svg'));
  $('copy').addEventListener('click', copy);

  let tt;
  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2400); }

  document.addEventListener('keydown', (e) => {
    if (e.altKey || !(e.ctrlKey || e.metaKey)) return;
    if (e.key.toLowerCase() === 's') { e.preventDefault(); download(e.shiftKey ? 'svg' : state.fmt); }
  });

  // paste: image → logo; text outside a field → content
  document.addEventListener('paste', (e) => {
    const img = [...(e.clipboardData?.files || [])].find((f) => f.type.startsWith('image/'));
    if (img) { e.preventDefault(); setLogo(img); return; }
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    const t = e.clipboardData?.getData('text/plain');
    if (!t) return;
    e.preventDefault();
    state.kind = 'text'; state.f.text = t.trim(); save(); renderKinds(); renderFields(); update();
  });

  const drop = $('drop');
  let depth = 0;
  const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
  window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); depth++; drop.hidden = false; });
  window.addEventListener('dragover', (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  window.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; if (--depth <= 0) { depth = 0; drop.hidden = true; } });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; drop.hidden = true;
    setLogo(e.dataTransfer.files[0]);
  });

  let lastW = 0, rT;
  new ResizeObserver(() => { const w = Math.floor($('qr').clientWidth); if (w !== lastW) { lastW = w; clearTimeout(rT); rT = setTimeout(update, 80); } }).observe($('qr'));

  renderKinds();
  renderFields(true);
  renderPresets();
  syncControls();
  update();
  const f = document.querySelector('#fields textarea, #fields input');
  if (f && f.select) f.select();
})();
</script>
</body>
</html>
